[project]
name = "forgetting-shapelets"
version = "0.1.0"
description = "Shapelets para prever cards Anki problemáticos e esquecimento em revisão espaçada"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "huggingface_hub>=0.25",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs"]
